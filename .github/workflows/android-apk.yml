
name: Build Budgehoun APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Installer les composants Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraire le projet
        run: unzip -q Budgehoun-2.0-source.zip

      - name: Compiler l'APK
        run: cd budgehoun_work && gradle --no-daemon :app:assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Budgehoun-2.0-debug-apk
          path: budgehoun_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
